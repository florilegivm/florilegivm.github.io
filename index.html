<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ирина Пушкарева — ботаническая акварель</title>
<meta name="description" content="Ботаническая акварель. Работы Ирины Пушкаревой.">
<meta property="og:title" content="Ирина Пушкарева — ботаническая акварель">
<meta property="og:description" content="Галерея работ и контакты">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6f3ed">
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f6f3ed;      /* фон: тёплая бумага, слабо насыщенная */
    --ink: #2b2a27;        /* основной текст */
    --muted: #77736b;      /* второстепенный текст */
    --line: #ddd6ca;       /* тонкие линии */
    --placeholder: #ebe6dc;
    --serif: Georgia, "Noto Serif", "PT Serif", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  /* Шапка — скромно */
  header { padding: 64px 0 32px; text-align: center; }
  .name {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.05rem;
    letter-spacing: 0.05em;
  }
  .genre { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.03em; }
  .to-contacts {
    display: inline-block; margin-top: 10px; padding: 6px 4px;
    font-size: 0.8rem; color: var(--muted); text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  .about {
    max-width: 34em; margin: 18px auto 0;
    font-family: var(--serif); font-size: 0.95rem; color: var(--muted);
  }

  /* Галерея */
  .gallery { display: flex; gap: 14px; align-items: flex-start; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
  .work { margin: 0; }
  .work button {
    display: block; width: 100%; padding: 0; border: 0; background: none;
    cursor: zoom-in; -webkit-tap-highlight-color: transparent;
  }
  .work img { display: block; width: 100%; height: auto; }
  .work img.loading { aspect-ratio: 4 / 5; background: var(--placeholder); }
  .work figcaption {
    margin-top: 8px; font-family: var(--serif); font-size: 0.85rem;
    color: var(--muted); line-height: 1.35;
  }
  .work.broken button { display: none; }
  .work .missing {
    padding: 12px; border: 1px dashed #b9a98f; font-size: 0.8rem;
    color: #8a6d45; word-break: break-all;
  }
  .empty { text-align: center; color: var(--muted); font-family: var(--serif); padding: 40px 0; }

  @media (min-width: 700px) {
    .gallery { gap: 24px; }
    .col { gap: 36px; }
    header { padding: 96px 0 48px; }
  }

  /* Контакты */
  .contacts { text-align: center; padding: 56px 0 24px; }
  .contacts h2 {
    margin: 0 0 18px; font-family: var(--serif); font-weight: 400;
    font-size: 1rem; letter-spacing: 0.05em; color: var(--muted);
  }
  .buttons { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; min-width: 240px; padding: 12px 24px;
    border: 1px solid var(--ink); border-radius: 2px;
    color: var(--ink); text-decoration: none; font-size: 0.95rem;
  }
  .btn:active { background: var(--placeholder); }
  @media (hover: hover) { .btn:hover { background: var(--placeholder); } }

  footer { text-align: center; padding: 24px 0 40px; font-size: 0.75rem; color: var(--muted); }

  /* Просмотр во весь экран */
  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: var(--paper);
    display: flex; flex-direction: column;
  }
  .lb[hidden] { display: none; }
  .lb-top { display: flex; justify-content: flex-end; padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 0 6px; }
  .lb-stage {
    flex: 1; min-height: 0; display: flex;
    align-items: center; justify-content: center; padding: 0 12px;
  }
  .lb-fig { margin: 0; display: flex; flex-direction: column; align-items: center; max-width: 100%; }
  .lb-img {
    display: block; max-width: 100%; width: auto; height: auto;
    max-height: calc(100vh - 160px);
    max-height: calc(100dvh - 160px);
  }
  .lb-img.loading { visibility: hidden; }
  .lb-cap {
    margin-top: 10px; min-height: 1.4em; text-align: center;
    font-family: var(--serif); font-size: 0.9rem; color: var(--muted);
  }
  .lb-bar {
    display: flex; align-items: center; justify-content: center; gap: 28px;
    padding: 6px 0 max(12px, env(safe-area-inset-bottom));
  }
  .icon-btn {
    width: 48px; height: 48px; padding: 12px; border: 0; border-radius: 50%;
    background: none; color: var(--ink); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn svg { display: block; width: 24px; height: 24px; }
  .icon-btn[hidden] { visibility: hidden; display: block; }
  .icon-btn:focus-visible, .btn:focus-visible, .work button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .lb-count { min-width: 4em; text-align: center; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<header class="wrap">
  <h1 class="name">Ирина Пушкарева</h1>
  <p class="genre">ботаническая акварель</p>
  <p class="about" id="about" hidden></p>
</header>

<main class="wrap">
  <div class="gallery" id="gallery"></div>
  <p class="empty" id="empty" hidden>Работы скоро появятся.</p>

  <section class="contacts" id="contacts">
    <h2>Связаться</h2>
    <div class="buttons">
      <a class="btn" href="https://t.me/irinpushkareva">Telegram&nbsp;· @irinpushkareva</a>
    </div>
  </section>
</main>

<footer>© <span id="year"></span> Ирина Пушкарева</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр работы" hidden>
  <div class="lb-top">
    <button class="icon-btn" id="lb-close" type="button" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="lb-stage">
    <figure class="lb-fig">
      <img class="lb-img" id="lb-img" alt="">
      <figcaption class="lb-cap" id="lb-cap"></figcaption>
    </figure>
  </div>
  <div class="lb-bar">
    <button class="icon-btn" id="lb-prev" type="button" aria-label="Предыдущая работа">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="lb-count" id="lb-count"></span>
    <button class="icon-btn" id="lb-next" type="button" aria-label="Следующая работа">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
/* =====================================================================
   СПИСОК РАБОТ — единственное место, которое нужно менять.

   Как добавить картину:
   1. Положите фото в папку images рядом с этим файлом.
      Имя файла — латиницей, без пробелов и русских букв: rose.jpg, iris-2.jpg
   2. Добавьте строку в список ниже, по образцу:
        { file: "rose.jpg", title: "Роза", year: "2025" },
      title — название, year — год. Если пока не знаете — оставьте "".
   3. Порядок строк = порядок на сайте: первая строка — первая картина.

   Важно: каждая строка заканчивается запятой; кавычки — прямые "".
   Две косые черты // в начале строки отключают её (она не показывается).
   ===================================================================== */
const WORKS = [
  // { file: "rose.jpg", title: "Роза", year: "2025" },
  // { file: "iris.jpg", title: "", year: "" },
];

/* Текст «О себе», 1–3 предложения, в кавычках.
   Пока пусто — блок на сайте не показывается. */
const ABOUT = "";


/* ---------- Дальше — механика сайта, менять не нужно ---------- */
(function () {
  const AUTHOR = "Ирины Пушкаревой";
  const items = WORKS.filter(w => w && w.file);
  const gallery = document.getElementById("gallery");

  document.getElementById("year").textContent = new Date().getFullYear();

  if (ABOUT.trim()) {
    const about = document.getElementById("about");
    about.textContent = ABOUT.trim();
    about.hidden = false;
  }

  if (!items.length) {
    document.getElementById("empty").hidden = false;
    return;
  }

  const src = w => "images/" + w.file;
  const caption = w => [w.title, w.year].filter(Boolean).join(", ");
  const altText = w => w.title
    ? w.title + " — ботаническая акварель " + AUTHOR + (w.year ? ", " + w.year : "")
    : "Ботаническая акварель " + AUTHOR;

  /* Карточки */
  const figs = items.map((w, i) => {
    const fig = document.createElement("figure");
    fig.className = "work";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-label", "Открыть во весь экран: " + (w.title || "работа " + (i + 1)));

    const img = document.createElement("img");
    img.loading = "lazy";          // ленивая загрузка — ставится до src
    img.decoding = "async";
    img.className = "loading";
    img.alt = altText(w);
    img.addEventListener("load", () => img.classList.remove("loading"));
    img.addEventListener("error", () => {
      fig.classList.add("broken");
      const note = document.createElement("div");
      note.className = "missing";
      note.textContent = "Не найден файл: " + src(w);
      fig.insertBefore(note, fig.firstChild);
    });
    img.src = src(w);

    btn.appendChild(img);
    btn.addEventListener("click", () => open(i));
    fig.appendChild(btn);

    const c = caption(w);
    if (c) {
      const fc = document.createElement("figcaption");
      fc.textContent = c;
      fig.appendChild(fc);
    }
    return fig;
  });

  /* Колонки: 2 на телефоне, 3–4 на компьютере. Картины не обрезаются. */
  let cols = 0;
  function layout() {
    const w = gallery.clientWidth;
    const n = w < 700 ? 2 : w < 1000 ? 3 : 4;
    if (n === cols) return;
    cols = n;
    gallery.innerHTML = "";
    const columns = [];
    for (let k = 0; k < n; k++) {
      const d = document.createElement("div");
      d.className = "col";
      gallery.appendChild(d);
      columns.push(d);
    }
    figs.forEach((f, i) => columns[i % n].appendChild(f));
  }
  layout();
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(layout, 150); });

  /* Просмотр во весь экран */
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lb-img");
  const lbCap = document.getElementById("lb-cap");
  const lbCount = document.getElementById("lb-count");
  const btnClose = document.getElementById("lb-close");
  const btnPrev = document.getElementById("lb-prev");
  const btnNext = document.getElementById("lb-next");
  const many = items.length > 1;
  let cur = 0, lastFocus = null;

  btnPrev.hidden = btnNext.hidden = !many;
  lbImg.addEventListener("load", () => lbImg.classList.remove("loading"));

  function show(i) {
    cur = (i + items.length) % items.length;
    const w = items[cur];
    lbImg.classList.add("loading");
    lbImg.src = src(w);
    lbImg.alt = altText(w);
    if (lbImg.complete && lbImg.naturalWidth) lbImg.classList.remove("loading");
    lbCap.textContent = caption(w);
    lbCount.textContent = many ? (cur + 1) + " / " + items.length : "";
    if (many) {   // заранее подгружаем соседние
      [cur + 1, cur - 1].forEach(j => {
        const p = new Image();
        p.src = src(items[(j + items.length) % items.length]);
      });
    }
  }
  function open(i) {
    lastFocus = document.activeElement;
    show(i);
    lb.hidden = false;
    document.body.style.overflow = "hidden";
    btnClose.focus();
  }
  function close() {
    lb.hidden = true;
    document.body.style.overflow = "";
    lbImg.removeAttribute("src");
    if (lastFocus) lastFocus.focus();
  }

  btnClose.addEventListener("click", close);
  btnPrev.addEventListener("click", () => show(cur - 1));
  btnNext.addEventListener("click", () => show(cur + 1));

  /* Тап по фону — закрыть (по самой картине и кнопкам — нет) */
  lb.addEventListener("click", e => {
    if (e.target === lbImg || e.target.closest("button") || e.target.closest(".lb-bar")) return;
    close();
  });

  document.addEventListener("keydown", e => {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight" && many) show(cur + 1);
    else if (e.key === "ArrowLeft" && many) show(cur - 1);
  });

  /* Свайп влево-вправо (не мешает щипку для увеличения) */
  let sx = 0, sy = 0, tracking = false;
  lb.addEventListener("touchstart", e => {
    const zoomed = window.visualViewport && window.visualViewport.scale > 1.05;
    if (e.touches.length !== 1 || zoomed) { tracking = false; return; }
    tracking = true;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  lb.addEventListener("touchend", e => {
    if (!tracking || !many) return;
    tracking = false;
    const p = e.changedTouches[0];
    const dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();
</script>
</body>
</html>
